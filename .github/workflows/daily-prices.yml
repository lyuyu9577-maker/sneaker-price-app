name: Daily verified shoe prices
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-verified-prices
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect actual source observations
        id: collect
        continue-on-error: true
        run: python daily_collect_prices.py
      - name: Persist observations and collection status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- verified_prices.jsonl collection_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record actual daily shoe prices"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report source failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
